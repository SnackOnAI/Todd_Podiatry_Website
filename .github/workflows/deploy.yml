name: Deploy Todd Podiatry

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest code
        run: |
          cd ~/todd-podiatry
          git pull origin main

      - name: Install dependencies
        run: |
          cd ~/todd-podiatry
          npm install

      - name: Restart app
        run: |
          cd ~/todd-podiatry
          pm2 restart todd-podiatry || pm2 start server.js --name todd-podiatry
